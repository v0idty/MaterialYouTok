name: MaterialYouTok
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ github.token }}
        run: ./gradlew :patches:build -x :patches:apiCheck
      - name: CLI
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download --repo ReVanced/revanced-cli --pattern '*-all.jar' --output cli.jar
      - name: Original TikTok
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download src2 --repo "${{ github.repository }}" --pattern 'tiktok.apk' --output tiktok.apk
      - name: Verify APK
        run: |
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 | sort | tail -n1)
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner | sort | tail -n1)
          echo "APKSIGNER=$APKSIGNER"
          "$AAPT" dump badging tiktok.apk | grep -E "^package:|application-label:'" || true
          "$APKSIGNER" verify --verbose --print-certs tiktok.apk 2>&1 | head -30 || true
          ls -l tiktok.apk
      - name: Patch
        run: |
          MY=$(ls patches/build/libs/*.rvp | head -n1)
          java -jar cli.jar patch -p "$MY" -b \
            -e "MaterialYouTok icon" \
            -o MaterialYouTok.apk tiktok.apk
      - name: Publish APK to private release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "build-${{ github.run_number }}" MaterialYouTok.apk --repo "${{ github.repository }}" --title "MaterialYouTok build ${{ github.run_number }}" --notes "Private test build"
