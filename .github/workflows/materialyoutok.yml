name: MaterialYouTok

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build MaterialYouTok patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ github.token }}
        run: ./gradlew --no-daemon :patches:build -x :patches:apiCheck

      - name: Upload patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: MaterialYouTok-patches
          path: patches/build/libs/*.rvp
          if-no-files-found: error
          retention-days: 14
