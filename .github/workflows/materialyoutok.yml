name: MaterialYouTok
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/materialyoutok.yml"
      - "patches/**"
      - "extensions/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ github.token }}
        run: ./gradlew :patches:build

      - name: CLI
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download v6.0.0 --repo ReVanced/revanced-cli --pattern '*-all.jar' --output cli.jar

      - name: Inspect built patches
        run: |
          set -euo pipefail
          MY=$(find patches/build/libs -maxdepth 1 -type f -name '*.rvp' ! -name '*-sources.rvp' ! -name '*-javadoc.rvp' -print -quit)
          test -n "$MY"
          echo "Selected patches artifact: $MY"
          ls -lah patches/build/libs
          echo "RVP archive contents:"
          unzip -l "$MY" | head -80
          echo "Patches visible to CLI:"
          if ! PATCH_LIST=$(java -jar cli.jar list-patches --packages --versions --options -bp "$MY" 2>&1); then
            printf '%s\n' "$PATCH_LIST"
            exit 1
          fi
          printf '%s\n' "$PATCH_LIST"
          printf '%s\n' "$PATCH_LIST" | grep -F "Name: MaterialYouTok icon" >/dev/null

      # Keep the selected source release: src2 contains the project's pinned TikTok 47.2.41 input.
      - name: Original TikTok
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download src2 --repo "${{ github.repository }}" --pattern 'tiktok.apk' --output tiktok.apk

      - name: Verify original APK
        run: |
          set -euo pipefail
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 | sort -V | tail -n1)
          test -s tiktok.apk
          SOURCE_BADGING=$("$AAPT" dump badging tiktok.apk)
          printf '%s\n' "$SOURCE_BADGING" | grep -E "^package:|^application:"
          printf '%s\n' "$SOURCE_BADGING" | grep -F "package: name='com.zhiliaoapp.musically'" >/dev/null
          printf '%s\n' "$SOURCE_BADGING" | grep -F "versionName='47.2.41'" >/dev/null
          echo "Verified pinned src2 input: TikTok 47.2.41."

      - name: Patch app branding only
        run: |
          set -euo pipefail
          MY=$(find patches/build/libs -maxdepth 1 -type f -name '*.rvp' ! -name '*-sources.rvp' ! -name '*-javadoc.rvp' -print -quit)
          test -n "$MY"
          # --exclusive is intentional: do not implicitly apply every default-enabled patch.
          java -jar cli.jar patch -p "$MY" -b --exclusive \
            -e "MaterialYouTok icon" \
            -o MaterialYouTok.apk tiktok.apk
          test -s MaterialYouTok.apk

      - name: Diagnose empty drawable PNGs after patch failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          RES="MaterialYouTok-temporary-files/patcher/apk/res"
          if [ ! -d "$RES" ]; then
            echo "Decoded resources directory not found: $RES"
            exit 0
          fi

          echo "Zero-byte drawable PNG resources:"
          find "$RES" -mindepth 1 -maxdepth 1 -type d -name 'drawable*' -print0 |
            while IFS= read -r -d '' dir; do
              find "$dir" -type f -iname '*.png' -size 0 -printf '%p | %s bytes\\n'
            done

      - name: Diagnose invalid decoded resource XML after patch failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          RES="MaterialYouTok-temporary-files/patcher/apk/res"
          python3 - "$RES" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(sys.argv[1])
          if not root.is_dir():
              print(f"Decoded resources directory not found: {root}")
              raise SystemExit(0)

          failures = 0
          for path in root.rglob("*.xml"):
              try:
                  ET.parse(path)
              except ET.ParseError as error:
                  failures += 1
                  line, column = error.position
                  print(f"INVALID XML: {path} ({error})")
                  lines = path.read_text(encoding="utf-8", errors="backslashreplace").splitlines()
                  for number in range(max(1, line - 2), min(len(lines), line + 2) + 1):
                      print(f"{number}: {lines[number - 1][:500]!r}")
                  raw_lines = path.read_bytes().splitlines()
                  if 1 <= line <= len(raw_lines):
                      print(f"line {line} bytes: {raw_lines[line - 1][:500].hex(' ')}")

          print(f"Malformed resource XML files found: {failures}")
          PY

      - name: Verify patched APK
        run: |
          set -euo pipefail
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 | sort -V | tail -n1)
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner | sort -V | tail -n1)

          BADGING=$("$AAPT" dump badging MaterialYouTok.apk)
          echo "---- patched APK badging ----"
          printf '%s\n' "$BADGING" | grep -E "^(package:|application:|application-label:)"
          echo "---- manifest label attributes ----"
          "$AAPT" dump xmltree --file AndroidManifest.xml MaterialYouTok.apk > manifest-tree.txt
          grep -n -A10 -B2 "E: application" manifest-tree.txt | head -50
          printf '%s\n' "$BADGING" | grep -F "application-label:'MaterialYouTok'" >/dev/null
          printf '%s\n' "$BADGING" | grep -F "package: name='com.zhiliaoapp.musically'" >/dev/null
          printf '%s\n' "$BADGING" | grep -F "versionName='47.2.41'" >/dev/null

          ICON_PATH=$(printf '%s\n' "$BADGING" | sed -n "s/^application:.* icon='\\([^']*\\)'.*/\\1/p" | head -n1)
          test -n "$ICON_PATH"
          unzip -p MaterialYouTok.apk "$ICON_PATH" > patched-icon.png
          file patched-icon.png | grep -F "PNG image data" >/dev/null
          test -s patched-icon.png
          cmp -s patched-icon.png patches/src/main/resources/materialyoutok/ic_launcher.png
          sha256sum patched-icon.png

          "$APKSIGNER" verify --verbose MaterialYouTok.apk
          echo "Verified: pinned TikTok version, package, MaterialYouTok label, exact launcher icon asset, and APK signature."

      - name: Publish APK to private release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "build-${{ github.run_number }}" MaterialYouTok.apk --repo "${{ github.repository }}" --title "MaterialYouTok build ${{ github.run_number }}" --notes "Branding-only test build"
