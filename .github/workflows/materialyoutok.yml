name: MaterialYouTok
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ github.token }}
        run: ./gradlew :patches:build -x :patches:apiCheck
      - name: CLI
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download --repo ReVanced/revanced-cli --pattern '*-all.jar' --output cli.jar
      - name: Original TikTok
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download src --repo "${{ github.repository }}" --pattern 'tiktok.apk' --output tiktok.apk
      - name: Patch
        run: |
          MY=$(ls patches/build/libs/*.rvp | head -n1)
          java -jar cli.jar patch -p "$MY" \
            -e "MaterialYouTok region" \
            -e "MaterialYouTok icon" \
            -o MaterialYouTok.apk tiktok.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialYouTok
          path: MaterialYouTok.apk
          retention-days: 3
