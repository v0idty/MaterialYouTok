name: MaterialYouTok
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: ./gradlew :patches:build
      - name: Tools
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download --repo ReVanced/revanced-cli --pattern '*-all.jar' --output cli.jar
          gh release download --repo ReVanced/revanced-patches --pattern '*.rvp' --output official.rvp
      - name: Show SIM spoof options
        run: java -jar cli.jar list-patches --with-options official.rvp | grep -i -A12 "sim spoof" || true
      - name: Original TikTok
        run: curl -fL -o tiktok.apk "${{ secrets.TIKTOK_APK_URL }}"
      - name: Patch
        run: |
          MY=$(ls patches/build/libs/*.rvp | head -n1)
          java -jar cli.jar patch -p official.rvp -p "$MY" \
            -e "SIM spoof" -O countryIso=by \
            -e "MaterialYouTok icon" \
            -o MaterialYouTok.apk tiktok.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialYouTok
          path: MaterialYouTok.apk
          retention-days: 3
