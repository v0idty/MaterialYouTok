name: Build fork
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Get sources
        run: git clone --depth 1 https://git.narez.xyz/narezany/MargyT src
      - name: Original TikTok
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download src2 --repo "${{ github.repository }}" --pattern 'tiktok.apk' --output tiktok.apk
      - name: Build
        env: { MARGYT_WORKERS: "2" }
        run: |
          cd src
          chmod +x build.sh
          ./build.sh ../tiktok.apk
          ls -l build
          - name: Check result
        run: |
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -name aapt2 | sort | tail -n1)
          ls -l src/build
          for f in src/build/*.apk; do
            echo "== $f"
            "$AAPT" dump badging "$f" | grep -E "^package:|application-label:'" || true
            echo -n "mod markers: "
            unzip -p "$f" 'classes*.dex' | grep -a -c "cat/narezany/margyt" || true
          done
      - name: Publish APK to private release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "fork-${{ github.run_number }}" src/build/*.apk --repo "${{ github.repository }}" --title "Fork build ${{ github.run_number }}" --notes "Private test build"
